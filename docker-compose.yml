# Build context is the repo root so every Python service can import contracts/ and connectors/.
# Each service's Dockerfile is created by its owner in the Setup milestone.
services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    env_file: .env
    environment:
      - GEO_URL=http://geo:8001
      - SITES_URL=http://sites:8002
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./fixtures:/app/fixtures
      - ./catalog:/app/catalog
      - ./packs:/app/packs
      - ./evals:/app/evals
    depends_on:
      - geo
      - sites

  geo:
    build:
      context: .
      dockerfile: services/geo/Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./fixtures:/app/fixtures
      - ./packs:/app/packs

  sites:
    build:
      context: .
      dockerfile: services/sites/Dockerfile
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./fixtures:/app/fixtures

  web:
    build:
      context: ./web
    environment:
      - VITE_AGENT_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - agent
