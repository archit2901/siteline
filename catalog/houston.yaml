region_id: hou
entries:
- id: cdc_places_tract_2025
  title: 'CDC PLACES: census tract health measures (GIS friendly), 2025 release'
  publisher: Centers for Disease Control and Prevention
  url: https://data.cdc.gov/d/yjkw-uj5s
  format: socrata
  geo_level: tract
  geo_key: tractfips
  measures:
  - arthritis prevalence
  - diabetes prevalence
  - high blood pressure prevalence
  - coronary heart disease
  - current asthma
  - COPD
  - cancer prevalence
  - stroke
  - obesity
  - depression
  - frequent mental distress
  - physical inactivity (no leisure-time physical activity)
  - binge drinking
  - current smoking
  - routine checkup in past year
  - dental visit in past year
  - all teeth lost among seniors
  - lack of health insurance
  - lack of reliable transportation
  - mobility disability
  - any disability
  - hearing disability
  - vision disability
  - cognitive disability
  - food insecurity
  - loneliness
  - mammography screening
  - colorectal cancer screening
  - high cholesterol
  - sleep less than 7 hours
  coverage: national, census tract (2020 geography); 1,376 Houston tracts
  connector: null
  notes: One row per tract; columns like arthritis_crudeprev, diabetes_crudeprev, bphigh_crudeprev, lacktrpt_crudeprev (crude
    prevalence, percent of adults). Kidney disease is not in this release.
