# StockPack (contracts/models.py). The default for ANY business in Houston; healthcare.base extends it.
# Feature ids are columns of the Houston grid (data/raw + data/derived/general_stock.parquet, fixtures/grid.json).
# Ring sums (*_within_5km) are straight-line k=6 H3 rings (about 5 km).
id: general.base
demand_age_bands: ["0-17", "18-44", "45-64", "65+"]
visit_rates: {}
features:
  - {id: pop_density_km2, source: acs, value: pop_density_km2, label: "Population density", agg: density, direction: 1, unit: "people/km2"}
  - {id: pop_total_within_5km, source: acs, value: pop_total_within_5km, label: "People within 5 km", agg: sum, direction: 1, unit: "people"}
  - {id: pop_u18_within_5km, source: acs, value: pop_u18_within_5km, label: "Children under 18 within 5 km", agg: sum, direction: 1, unit: "people"}
  - {id: pop_45plus_within_5km, source: acs, value: "pop_45_64_within_5km+pop_65p_within_5km", label: "People 45+ within 5 km", agg: sum, direction: 1, unit: "people"}
  - {id: pop_65p_within_5km, source: acs, value: pop_65p_within_5km, label: "People 65+ within 5 km", agg: sum, direction: 1, unit: "people"}
  - {id: pop_growth_pct, source: acs, value: pop_growth_pct, label: "Population growth 2020-24", agg: mean, direction: 1, unit: "%"}
  - {id: median_hh_income, source: acs, value: median_hh_income, label: "Median household income", agg: mean, direction: 1, unit: "USD"}
  - {id: share_spanish, source: acs, value: share_spanish, label: "Share speaking Spanish at home", agg: mean, direction: 1, unit: "share"}
  - {id: share_lep, source: acs, value: share_lep, label: "Share with limited English", agg: mean, direction: 1, unit: "share"}
  - {id: households_within_5km, source: acs.sf, value: households_within_5km, label: "Households within 5 km", agg: sum, direction: 1, unit: "households"}
  - {id: renter_households_within_5km, source: acs.sf, value: renter_households_within_5km, label: "Renter households within 5 km", agg: sum, direction: 1, unit: "households"}
  - {id: share_renter, source: acs.sf, value: share_renter, label: "Share of households renting", agg: mean, direction: 1, unit: "share"}
  - {id: share_multifamily, source: acs.sf, value: share_multifamily, label: "Share of homes in buildings with 5+ units", agg: mean, direction: 1, unit: "share"}
  - {id: share_no_vehicle, source: acs.sf, value: share_no_vehicle, label: "Share of households without a car", agg: mean, direction: 1, unit: "share"}
  - {id: no_vehicle_households_within_5km, source: acs.sf, value: no_vehicle_households_within_5km, label: "Households without a car within 5 km", agg: sum, direction: 1, unit: "households"}
  - {id: jobs_within_5km, source: lodes, value: jobs_within_5km, label: "Jobs within 5 km (daytime workers)", agg: sum, direction: 1, unit: "jobs"}
  - {id: jobs_density_km2, source: lodes, value: jobs_density_km2, label: "Jobs per km² (daytime density)", agg: density, direction: 1, unit: "jobs/km2"}
site_rules: {space_uses: ["Office", "OfficeMedical", "Medical", "Retail", "OfficeRetail", "Flex"]}
factor_hints: []
