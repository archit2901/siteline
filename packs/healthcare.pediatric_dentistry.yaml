# StockPack (contracts/models.py). Feature ids are Houston grid columns (see healthcare.base.yaml).
id: healthcare.pediatric_dentistry
extends: healthcare.base
specialty: pediatric_dentistry
demand_age_bands: ["0-17"]
# Share of residents in each age band who are patients of this specialty in a year. PLANNING ASSUMPTIONS informed
# by NCHS NAMCS (ambulatory visits by specialty and age) and USRDS (dialysis prevalence); not sourced per Houston.
# Replace with sourced rates when available; the run caveats say they are assumptions.
visit_rates: {"0-17": 0.55}
features:
  - {id: pop_u18_within_5km, source: acs, value: pop_u18_within_5km, label: "Children under 18 within 5 km", agg: sum, direction: 1, unit: "children"}
  - {id: medicaid_u19_within_5km, source: acs, value: medicaid_u19_within_5km, label: "Children on Medicaid/CHIP within 5 km", agg: sum, direction: 1, unit: "children"}
  - {id: n_pediatrics_within_5km, source: cms.doctors, value: n_pediatrics_within_5km, label: "Pediatricians within 5 km (referral base)", agg: sum, direction: 1, unit: "clinicians"}
# The CMS file has only 39 dentists, so pediatric dentist competition needs NPPES (agent-found).
site_rules: {ground_floor: true}
factor_hints:
  - "Medicaid and CHIP families"
  - "Spanish-speaking households"
  - "schools nearby"
  - "bus access for families without a car (METRO stops)"
  - "pediatric dentist competition (NPPES taxonomy 1223P0221X)"
