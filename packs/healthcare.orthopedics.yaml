# StockPack (contracts/models.py). Feature ids are Houston grid columns (see healthcare.base.yaml).
id: healthcare.orthopedics
extends: healthcare.base
specialty: orthopedics
demand_age_bands: ["45-64", "65+"]
# Annual orthopedic visits per person by age band; 1.0 is used while empty (NCHS NAMCS rates still to be sourced).
visit_rates: {}
features:
  - {id: pop_45plus_within_5km, source: acs, value: "pop_45_64_within_5km+pop_65p_within_5km", label: "People 45+ within 5 km", agg: sum, direction: 1, unit: "people"}
  - {id: n_orthopedics_within_10km, source: cms.doctors, value: n_orthopedics_within_10km, label: "Orthopedic clinicians within 10 km (competition)", agg: sum, direction: -1, unit: "clinicians"}
site_rules: {min_parking_per_1000sf: 5, ground_floor: true, special_rooms: ["x-ray"], competitor_feature: n_orthopedics}
factor_hints:
  - "musculoskeletal or arthritis burden"
  - "sports participation and youth sports injuries"
  - "primary care referral base"
  - "parking and step-free access for patients on crutches"
