# StockPack (contracts/models.py). Feature ids are Houston grid columns (see healthcare.base.yaml).
id: healthcare.physical_therapy
extends: healthcare.base
specialty: physical_therapy
demand_age_bands: ["18-44", "45-64", "65+"]
# Share of residents in each age band who are patients of this specialty in a year. PLANNING ASSUMPTIONS informed
# by NCHS NAMCS (ambulatory visits by specialty and age) and USRDS (dialysis prevalence); not sourced per Houston.
# Replace with sourced rates when available; the run caveats say they are assumptions.
visit_rates: {"0-17": 0.03, "18-44": 0.08, "45-64": 0.11, "65+": 0.13}
features:
  # Same column as the orthopedics pack, opposite sign: nearby orthopedic surgeons refer patients to PT.
  - {id: n_orthopedics_within_10km, source: cms.doctors, value: n_orthopedics_within_10km, label: "Orthopedic clinicians within 10 km (referral source)", agg: sum, direction: 1, unit: "clinicians"}
  - {id: n_physical_therapy_within_5km, source: cms.doctors, value: n_physical_therapy_within_5km, label: "Physical therapists within 5 km (competition)", agg: sum, direction: -1, unit: "clinicians"}
site_rules: {ground_floor: true, competitor_feature: n_physical_therapy}
factor_hints:
  - "orthopedic surgeons nearby as a referral source"
  - "active adults, gyms and sports facilities"
  - "large employers and workers' compensation cases"
