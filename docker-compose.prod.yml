# Production on one EC2 box: Caddy (HTTPS + web build) in front of agent-api.
#   docker compose -f docker-compose.prod.yml up -d --build
# AWS credentials come from the EC2 instance role (IMDSv2, hop limit 2 so containers reach it). Never put keys in .env.
# data/ (CoStar files, derived stock, golden runs) is copied to the box by hand and never committed.
# The site is password-protected (infra/Caddyfile): .env.caddy holds SITE_USER and SITE_PASSWORD_HASH.
services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    env_file: .env
    environment:
      - AGENT_BACKEND=local
      - AGENT_MODE=scripted
      - FIXTURE_MODE=0
      - MAX_LIVE_RUNS=2
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    env_file: .env.caddy
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
